# Single source of truth for every model and tuning parameter.
#
# Nothing here is overridable by environment variables. Change a value in this
# file and it takes effect everywhere -- Django settings, the core pipeline,
# management commands, and the Ollama container's model pull. Environment
# variables are reserved for secrets and deployment wiring (SECRET_KEY,
# DB_PASSWORD, DEBUG, ALLOWED_HOSTS), which must not live in a committed file.
#
# ---------------------------------------------------------------------------
# HARDWARE PROFILE: a discrete NVIDIA GPU with ~11GB of VRAM. docker-compose.yml
# reserves the card for both the ollama and backend services -- the reranker
# and embedder run in backend, not in ollama, and need the card too.
#
# VRAM budget with everything resident (estimated for the qwen3:8b / bge-m3
# swap below -- re-measure after the swap and adjust this comment):
#
#   qwen3:8b, Q4_K_M                     ~5.0 GB
#   LLM KV cache at llm.num_ctx 6144     ~0.9 GB
#   bge-reranker-v2-m3, fp32             ~2.2 GB
#   bge-m3 embedder, fp32                ~2.2 GB
#   CUDA context + activations           ~1.0-1.5 GB
#                                        --------
#                                        ~11.3-11.8 GB of 11 GB
#
# HONEST READ OF THAT TABLE: on this estimate the budget is EXCEEDED. The
# pre-num_ctx figure (~10.4-10.9 GB) was already at the limit; the KV cache
# for a 6144-token window (see llm.num_ctx) adds ~0.9 GB on top. These are
# estimates, not measurements -- the real footprint may come in lower, but do
# not assume it. Re-measure on the card (nvidia-smi with all three models
# loaded) before relying on this profile. If it does not fit, the
# mitigations, in order of preference:
#   1. a smaller llm.num_ctx (KV cache scales linearly, ~0.147 MB/token),
#      with session.history_max_turns lowered to match so the prompt still
#      fits the window;
#   2. a smaller llm.model.
# reranking.device: cpu is NOT an acceptable mitigation: this reranker on CPU
# takes seconds per request (see the reranking block), which does not meet
# the latency goals.
#
# bge-m3 is XLM-RoBERTa-large-based, the same size class as the reranker, so
# it is noticeably heavier than the old mpnet embedder (~1.1GB).
#
# The reranker loads fp32, not fp16 -- sentence-transformers does not
# downcast bge-reranker-v2-m3 automatically. Budget for the larger figure.
#
# This profile does NOT fit an 8GB Apple Silicon machine, and Docker Desktop
# on macOS cannot reach the Apple GPU at all. For that machine the working
# settings were a small llm.model and reranking.enabled false, with Ollama
# run natively on the host for Metal. See docs/infrastructure.md.
# ---------------------------------------------------------------------------

llm:
  # Plain Qwen3 8B, pulled from Ollama's own model library (not a custom
  # hf.co GGUF pull) -- the product is English now, so there's no reason for
  # a Russian-adapted variant. Same architecture family as before: it's still
  # a hybrid-reasoning model, so the "think" handling below still applies.
  model: qwen3:8b
  base_url: http://ollama:11434

  # Qwen3 8B is a HYBRID REASONING model: left to itself it emits a
  # <think>...</think> block before its answer. That is actively harmful
  # here. Classification and intent parsing run on a JSON schema (they share
  # one call) and expect a bare object, and the
  # reasoning pass costs seconds per call on top of already-sequential LLM
  # calls per turn.
  #
  # Setting this false sends "think": false to Ollama, which suppresses the
  # reasoning pass on models that support the flag. ollama_client also strips
  # any <think> block defensively before parsing JSON, so an Ollama build that
  # ignores the flag degrades to "slower" rather than "broken".
  #
  # Set true only to experiment with reasoning quality on the explanation step.
  thinking: false

  # Context window (tokens) sent to Ollama as options.num_ctx on EVERY LLM
  # call -- classification, conversational replies, explanations, and the
  # sync/evaluation path. It is set explicitly so the window is a known,
  # budgeted size rather than whatever the Ollama default happens to be.
  #
  # Why 6144 (re-derived for English text; the first figure here was a
  # Russian estimate). ASSUMPTION: ~4 characters per token for English prose
  # on Qwen-family tokenizers (Russian is ~2-2.5, which is why the old
  # numbers were about twice these). One unit throughout: tokens per
  # user+assistant PAIR of replayed history. A pair is a short user turn (~50)
  # plus an assistant reply near the session.history_max_chars_per_entry cap
  # (1000 chars ~250) plus the "(Recommended: ...)" titles line (~30) plus
  # chat-template markers (~10) ~340. Heaviest call of a turn is classify+parse
  # (the long system prompt: the template is ~11.3k chars, ~11.7k rendered with
  # the genre list ~0.2k and the year rule, so ~2.9k tokens):
  # 2.9k system + 6 pairs ~2.0k + the latest set's facts block ~0.3k (~0.65k at
  # the max_n=10 cap; see below) + current message ~0.05k + JSON reply ~0.2k
  # = ~5.5k of 6144 (~5.8k with 10 movies of facts), only ~0.3-0.6k of
  # headroom. The explanation call is lighter (~3.3k: 0.23k system +
  # history + facts + 5 movies x (~15 + 50) ~0.4k + ~0.3k answer).
  # The window is generous now, but it is NOT a hard guarantee: if both
  # entries of every pair hit the 1000-char cap a pair is ~540 tokens, history
  # ~3.2k and classify+parse ~6.6k, past the window: history is then trimmed
  # by the turn cap or the model sees a truncated prompt; at 3.5 chars/token
  # (titles, names and JSON tokenize worse than prose) even the typical case
  # nears the 90% context warning. The current message
  # has no character cap. The per-call log (`Ollama call=... prompt_tokens=`)
  # gives the measured figure: re-size from it, not from this estimate. Caveat:
  # Ollama's prompt_eval_count may count only the tokens it newly evaluated
  # when it reuses a cached prompt prefix, so it can under-report a repeated
  # prompt; read it from a cold call (first request after a model load).
  #
  # Facts block: the latest recommendation set is replayed to the model as
  # facts (session.history_movie_description_chars): 5 movies x (200 chars ~50
  # + ~15 title/year/genres/runtime) ~0.33k, minus the ~0.03k titles-only line
  # it replaces, so ~+0.3k. Older sets stay titles-only precisely to keep this
  # to ONE block; do not replay facts for every past set without re-checking
  # this budget.
  #
  # Cost: the KV cache for qwen3:8b is ~36 layers x 8 KV heads x 128 dims x
  # 2 (K and V) x 2 bytes (fp16) ~= 0.147 MB/token, so 6144 tokens is ~0.9 GB
  # of extra VRAM (see the budget in the header -- on estimate it is now over
  # 11 GB). Each 1024 tokens of window is ~0.15 GB, so with the headroom above
  # a smaller value is the first lever if the card does not fit; measure the
  # prompt sizes first.
  #
  # Keep this ONE value for every call (structured and generation alike --
  # see temperature below). Ollama reloads the model whenever the
  # requested num_ctx differs from the loaded instance's, so mixing values
  # between requests means a multi-second reload on every switch.
  num_ctx: 6144

  # Sampling, sent as options.temperature / options.seed alongside num_ctx.
  # Unlike num_ctx these do not make Ollama reload the model, so they can
  # differ per call kind.
  #
  # structured: every schema-constrained call -- classify+parse, the sync intent call,
  # and the evaluation judge. These feed parsers and metrics, so the same
  # input should give the same output: 0.0 is greedy decoding, which makes
  # intent parsing reproducible and an eval run repeatable.
  # generation: free text the user reads -- explanations and conversational
  # replies. 0.7 keeps some variety in the wording; it is Qwen3's recommended
  # temperature for non-thinking mode (llm.thinking is false above).
  temperature:
    structured: 0.0
    generation: 0.7
  # Fixed so a generation call at 0.7 is also reproducible for a given
  # prompt (on the same Ollama build and hardware). Any int works; it is
  # pinned, not tuned.
  seed: 42

  # Characters of each movie's description put into the explanation prompt
  # (the `[[n]]` movie list the model writes its per-movie text from). Same
  # size as session.history_movie_description_chars on purpose: ~50 tokens
  # per movie (English, ~4 chars/token), enough premise for the model to say why it fits without
  # inflating a prompt that is already budgeted against llm.num_ctx. Minimum 1.
  explanation_description_chars: 200

  explanation:
    # Longest angle-bracket span (in characters between < and >) the explanation
    # stream drops as an echoed prompt placeholder such as "<opening line>".
    # Longer spans are kept as real text. Minimum 1.
    placeholder_max_chars: 60

  timeout_seconds:
    # Combined classify+intent call used by the live chat view (aclassify_and_parse).
    classify_parse: 45
    # Intent-only sync call (parse_intent). evaluate_scoring does not use it:
    # it runs classify_parse, the call the chat view makes.
    intent: 60
    explanation: 120

embedding:
  # 1024-dim BGE-M3 (~568M parameters, XLM-RoBERTa-large backbone, ~2.2GB
  # fp32). Upgraded from the old 768-dim multilingual-mpnet as part of the
  # TMDB catalog swap -- the full re-embed was happening anyway, so this
  # rides along instead of waiting on the separately-tracked golden-set-gated
  # comparison in TODOS.md. Multilingual, so it still handles non-English
  # content fine even though the product itself is English now.
  #
  # CHANGING EITHER VALUE IS NOT FREE. `dimensions` is baked into the
  # Movie.embedding column, so a change
  # needs a schema migration AND a full re-run of
  # `manage.py generate_embeddings` over the catalog. Existing vectors are
  # not convertible between models or dimensions.
  #
  # The index records what built it. `generate_embeddings` stores the model,
  # dimensions, text template version and the `text` values below in the
  # single-row EmbeddingIndex table, and `check_embedding_index` (run in the
  # backend start-up chain) refuses to start the container when they no longer
  # match this file, since same-width vectors from a different model or text
  # are not comparable with query vectors. After a deliberate change,
  # `generate_embeddings --all` rebuilds the catalog and refreshes the record.
  model: BAAI/bge-m3
  dimensions: 1024
  # Hugging Face commit the weights are downloaded at (SHA of the model repo's
  # main branch on 2026-10-15; last upstream change 2024-07-03). A Hub model
  # name alone follows the default branch, so a re-download could silently
  # bring different weights and invalidate the stored vectors. Treat a change
  # like a model change (`generate_embeddings --all`): the index records this
  # value, and check_embedding_index reports a difference as a mismatch when
  # both the recorded and the configured revision are set. null = unpinned.
  revision: 5617a9f61b028005a4858fdac845db406aefb181

  # Inputs of the per-movie text that gets embedded (see
  # core.embedding_service.build_movie_embedding_text). They are part of the
  # index provenance: changing either makes every stored vector stale, so it
  # needs the same `generate_embeddings --all` as a model change. Values equal
  # the literals the catalog was embedded with.
  text:
    # Leading characters of the description. Long plots add noise, not signal,
    # and the model's input window is finite.
    description_chars: 500
    # Keywords kept, taken in catalog order.
    max_keywords: 10

retrieval:
  # Candidates pulled from each channel before fusion.
  candidate_count: 100

  # Reciprocal Rank Fusion across the semantic and lexical channels. k=60 is
  # the value from the original paper. Semantic outweighs lexical because it
  # carries signal for every query, while lexical only fires when the user
  # names something -- so lexical loses ties rather than being suppressed.
  rrf_k: 60
  rrf_weights:
    semantic: 1.0
    lexical: 0.7

  lexical:
    # Postgres text search configuration. 'english' gives snowball stemming
    # over the catalog's English titles/keywords.
    text_search_config: english
    # Shorter tokens are almost all prepositions and articles.
    min_term_length: 3
    # Ceiling on tsquery size for a long rambling message.
    max_terms: 12
    # Conversational words that say nothing about the film but match titles
    # and keywords ("Movie", "Like", "Good", "Show"...). Dropped from the
    # lexical query so they don't drag those titles into the candidates; if
    # nothing is left the lexical channel is skipped and semantic search
    # carries the query. Lowercase, one word each.
    stopwords:
      - movie
      - movies
      - film
      - films
      - watch
      - something
      - anything
      - recommend
      - suggest
      - show
      - want
      - like
      - similar
      - please
      - good

scoring:
  # Applied to signals that have been min-max normalized across the candidate
  # set, so these weights describe actual influence. Must be >= 0 and sum to
  # 1.0: settings.py refuses to load otherwise.
  weights:
    # The session signal was removed (ADR 0010); the remaining weights are the
    # old ones renormalized proportionally.
    semantic: 0.4667
    metadata: 0.3333
    # Biases toward well-known titles. Deliberately a scoring signal, not a
    # hard filter -- TMDB's popularity metric is unbounded and non-linear,
    # so there's no absolute threshold an LLM could reliably pick (unlike
    # vote_average's bounded 0-10 scale, which *is* a hard filter below).
    popularity: 0.2
  # Value given to a signal that is identical across every candidate and so
  # carries no ranking information.
  neutral_score: 0.5

diversification:
  # Results returned to the user.
  top_n: 5
  # Upper bound on a user-requested count (intent `result_count`, e.g. "top 10");
  # a larger request is clamped to this. Minimum is 1 (a request below it is raised).
  max_n: 10
  # MMR relevance/diversity tradeoff. 1.0 is pure relevance, 0.0 pure novelty.
  lambda: 0.7

reranking:
  enabled: true
  # bge-reranker-v2-m3: multilingual, XLM-RoBERTa-large backbone (~568M params,
  # ~302M in the body). Measured on this GPU (GTX 1080 Ti): 20 pairs ~0.26s,
  # 50 pairs ~0.64s, 100 pairs ~1.22s -- versus ~5.6s for 20 pairs on CPU.
  # The GFLOPs estimate this used to cite was off by ~2x on the GPU side and
  # ~3x on the CPU side; the CPU/GPU ratio it implied held up.
  model: BAAI/bge-reranker-v2-m3
  # Hugging Face commit the weights are downloaded at (SHA of the model repo's
  # main branch on 2026-10-15; last upstream change 2024-06-24), so a
  # re-download cannot silently change the scores the min_score gate and the
  # blend weight were calibrated on. Nothing is recorded in the DB for this
  # one: the reranker has no stored artifacts. null = unpinned.
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  # auto lets sentence-transformers pick (cuda > mps > cpu). Pin to "cpu" to
  # free ~2.2GB of VRAM, but only with a small reranker -- this model on CPU
  # makes every request take seconds instead of a fraction of one.
  device: auto
  # Every candidate here is a model forward pass: the main latency dial.
  # Raised from 20 to 50 now that this runs on GPU: +0.38s for a 2.5x larger
  # reranked pool, against a ~2s LLM call already in the same request.
  top_k: 50
  # Share of the final score taken from the cross-encoder; the rest stays with
  # the four-signal scorer, which carries session, genre intent, and popularity.
  # Must lie in [0, 1] (settings.py refuses to load otherwise).
  weight: 0.5
  # "Nothing suitable" gate: minimum raw cross-encoder score (rerank_score) a
  # candidate needs to reach the results. null = gate off, and it ships off
  # on purpose. When set, candidates below it -- and candidates the reranker
  # never scored (they ranked below the top_k head) -- are dropped before MMR,
  # so a reply can be shorter than diversification.top_n, or empty; an empty
  # one makes the chat answer "nothing matched" instead of padding with top-5.
  # The gate only acts on a request the reranker actually scored; with the
  # reranker disabled, not loaded, or failing, it is skipped (fail open, with
  # a warning) -- an infrastructure fault must not turn into zero results.
  # Range: sentence-transformers (pinned <3; read in 2.7.0, CrossEncoder
  # default_activation_function) applies Sigmoid to a single-label model's
  # logits in predict(), and bge-reranker-v2-m3 is single-label, so scores
  # are in [0, 1]; the value must lie strictly inside (0, 1). The model
  # itself could not be downloaded to confirm on the build host, so the
  # calibration run below also prints the observed min/max -- check they are
  # within [0, 1].
  # Uncalibrated: no number is shipped because an eyeballed threshold is the
  # exact defect the audit flagged for intent.genre_match_threshold -- a gate
  # set too high silently empties answerable queries, too low gates nothing.
  # Calibrate on the golden set's dev split, on the GPU box (the scores come
  # from the real reranker):
  #   python manage.py evaluate_scoring --intent oracle --gate-report
  # It prints hit vs non-hit rerank_score distributions and, per candidate
  # threshold, the share of hits it would drop and of queries it would empty.
  # Pick the value by hand and judge it on the test split; the report never
  # writes this file.
  # 2026-10-17 run (oracle, dev): 6 hits vs 129 non-hits, scores in [0, 1];
  # 0.01 drops no hits and 14% of non-hits, 0.02 empties 7.4% of queries.
  # Too few hits to pick a value until the golden labels are reviewed, so the
  # gate stays off (docs/adr/0009).
  min_score: null
  max_length: 256
  # Characters of description passed to the cross-encoder. The model truncates
  # to its own max_length anyway; this keeps tokenizer work bounded.
  description_chars: 400

session:
  ttl_hours: 24
  # Cap on how much conversation history gets replayed into every LLM call
  # (classification, conversational replies, explanations) as native
  # multi-turn `messages`. The last this-many user+assistant turn-pairs are
  # used; older turns are dropped, not summarized. Together with llm.num_ctx
  # this bounds the prompt: with 6 pairs a heavy-use prompt (~3.8k tokens
  # for English text, including the latest set's facts block -- see
  # llm.num_ctx for the derivation) fits the 6144-token window with ~2.3k
  # headroom, and the all-entries-at-the-cap case (~5.0k) still fits. The
  # window is roomy enough that a pair or two more would fit without touching
  # llm.num_ctx (each pair is ~0.34k typical, ~0.54k at the cap); check the
  # logged prompt_tokens first, and raise llm.num_ctx with it for more
  # (paying the extra KV-cache VRAM). Minimum 1: 0 does NOT
  # mean unlimited, and settings.py refuses to load a value below 1.
  history_max_turns: 6
  # Second, independent safety net: caps a single history entry's replayed
  # content by character count, so one abnormally long past message (e.g. a
  # long explanation) can't blow up the prompt even within the turn cap.
  # Minimum 1, enforced at settings load like history_max_turns.
  history_max_chars_per_entry: 1000
  # Per-movie description cap for the `movie_facts` stored with each assistant
  # recommendation turn (title, year, genres, runtime, description). Only the
  # LATEST shown set is replayed to the model (older ones stay titles-only),
  # so this is paid once per prompt: diversification.max_n (10) x (~200 chars
  # description ~50 tokens + ~15 tokens of title/year/genres/runtime) ~0.65k
  # tokens at the 10-movie cap (~0.33k for the default 5), which is why it is
  # 200 and not the full TMDB overview (500+ chars would cost ~0.7k and take a
  # third of the llm.num_ctx headroom). 200 chars is
  # enough for a follow-up like "what is the second one about?" to be answered
  # from the catalog, not from the model's memory. This is a storage-time cap:
  # lowering it only affects turns stored afterwards. Minimum 1.
  history_movie_description_chars: 200

evaluation:
  # LLM-as-judge (manage.py evaluate_scoring --llm-judge). Same model family as
  # the system it grades, so it is a secondary signal, not ground truth -- the
  # golden-set metrics are primary.
  #
  # Characters of a movie's description shown to the judge. Enough for the
  # premise of a TMDB overview; the full text adds prompt tokens per judged
  # movie (k per query) without changing what the judge can tell.
  judge_description_chars: 300
  # One short JSON reply per call. A judge call that runs past this counts as
  # a judge failure (no substitute score).
  judge_timeout_seconds: 30

intent:
  # "newest/latest/recent" means the last N catalog years, counted back from the
  # newest year the catalog holds (never the calendar year; the data can end
  # earlier). min_release_year = catalog max year - recent_years + 1.
  recent_years: 2

  # Entity resolution (core/entity_resolution.py): maps the parsed genres and
  # negations, country inclusions/exclusions and original languages onto exact
  # catalog values, because the filters compare them as exact strings ("USA"
  # matches nothing; the catalog says "United States of America"). Layers:
  # exact (casefold, collapsed whitespace) -> synonyms -> embedding nearest
  # catalog value -> drop with an INFO log. A dropped value widens the answer;
  # a guessed one silently swaps one filter for another.
  #
  # synonyms: only names the catalog does not spell that way. Each target must
  # be a catalog value; a missing one logs a WARNING on first use and is
  # ignored. Quote YAML words like no/yes/on/off (they load as booleans).
  #
  # match_threshold / match_margin: an embedding match is accepted only if
  # top-1 cosine >= match_threshold AND top1 - top2 >= match_margin (the margin
  # catches near-ties like South Korea vs North Korea, Thriller vs Crime).
  # UNCALIBRATED: 0.5 is the old intent.genre_match_threshold (eyeballed) and
  # 0.05 a starting guess. Calibrate on the GPU machine (the scores come from
  # the real embedder) with the probes in data/entity_probes.json:
  #   python manage.py entity_resolution_report
  # then set the values here and record the date and the numbers.
  resolution:
    genres:  # used for genres and negations; catalog: CATALOG_GENRES
      match_threshold: 0.5
      match_margin: 0.05
      synonyms:
        sci-fi: Science Fiction
    countries:  # country_inclusions / country_exclusions; catalog: distinct Movie.country
      match_threshold: 0.5
      match_margin: 0.05
      synonyms:
        USA: United States of America
        US: United States of America
        America: United States of America
        UK: United Kingdom
        Britain: United Kingdom
        England: United Kingdom
        Korea: South Korea
    languages:  # original_languages; catalog: distinct Movie.original_language
      # No embedding fallback: ISO 639-1 codes mean nothing to an embedder, so
      # this field takes exact codes and synonyms only.
      synonyms:
        korean: ko
        japanese: ja

catalog:
  # What the catalog has no data for. Rendered into the classify prompt (the
  # model lists such conditions as unsupported_constraints) and into the reply
  # that asks before searching without them. Keep "silent" and
  # "black-and-white": the prompt's example relies on them.
  unchecked_attributes: [cast, director, silent, black-and-white, awards, studio]
  import_batch_size: 500
  embedding_batch_size: 64
  # Quality floor applied at import time: rows below this vote_count are
  # dropped along with unreleased/adult/no-overview/no-poster rows. Chosen to
  # land the imported catalog around ~50K movies (from the raw 1.49M-row
  # TMDB export), a reasonable step up from the old 18K Okko catalog without
  # importing effectively-unknown, no-signal titles.
  min_vote_count: 20
  # TMDB's image CDN. poster_path from the catalog is appended directly:
  # "{poster_base_url}{poster_size}{poster_path}".
  poster_base_url: "https://image.tmdb.org/t/p/"
  poster_size: w500

# Console log level of the app's own loggers (core, movies): a stdlib level
# name. INFO carries the per-call Ollama stats and per-turn latency lines.
logging:
  level: INFO
