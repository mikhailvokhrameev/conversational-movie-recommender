# Single source of truth for every model and tuning parameter.
#
# Nothing here is overridable by environment variables. Change a value in this
# file and it takes effect everywhere -- Django settings, the core pipeline,
# management commands, and the Ollama container's model pull. Environment
# variables are reserved for secrets and deployment wiring (SECRET_KEY,
# DB_PASSWORD, DEBUG, ALLOWED_HOSTS), which must not live in a committed file.
#
# ---------------------------------------------------------------------------
# HARDWARE PROFILE: a discrete NVIDIA GPU with ~11GB of VRAM. docker-compose.yml
# reserves the card for both the ollama and backend services -- the reranker
# and embedder run in backend, not in ollama, and need the card too.
#
# VRAM budget with everything resident (estimated for the qwen3:8b / bge-m3
# swap below -- re-measure after the swap and adjust this comment):
#
#   qwen3:8b, Q4_K_M                     ~5.0 GB
#   bge-reranker-v2-m3, fp32             ~2.2 GB
#   bge-m3 embedder, fp32                ~2.2 GB
#   CUDA context + activations           ~1.0-1.5 GB
#                                        --------
#                                        ~10.4-10.9 GB of 11 GB
#
# This is noticeably tighter than the old mpnet embedder's ~1.1GB left --
# bge-m3 is XLM-RoBERTa-large-based, the same size class as the reranker.
# If it doesn't fit, the mitigations are the same as below: a smaller
# llm.model, or reranking.device: cpu.
#
# The reranker loads fp32, not fp16 -- sentence-transformers does not
# downcast bge-reranker-v2-m3 automatically. Budget for the larger figure.
#
# This profile does NOT fit an 8GB Apple Silicon machine, and Docker Desktop
# on macOS cannot reach the Apple GPU at all. For that machine the working
# settings were a small llm.model and reranking.enabled false, with Ollama
# run natively on the host for Metal. See docs/infrastructure.md.
# ---------------------------------------------------------------------------

llm:
  # Plain Qwen3 8B, pulled from Ollama's own model library (not a custom
  # hf.co GGUF pull) -- the product is English now, so there's no reason for
  # a Russian-adapted variant. Same architecture family as before: it's still
  # a hybrid-reasoning model, so the "think" handling below still applies.
  model: qwen3:8b
  base_url: http://ollama:11434

  # Qwen3 8B is a HYBRID REASONING model: left to itself it emits a
  # <think>...</think> block before its answer. That is actively harmful
  # here. Classification, intent parsing, and explanation run in JSON mode
  # (the first two share one call) and expect a bare object, and the
  # reasoning pass costs seconds per call on top of already-sequential LLM
  # calls per turn.
  #
  # Setting this false sends "think": false to Ollama, which suppresses the
  # reasoning pass on models that support the flag. ollama_client also strips
  # any <think> block defensively before parsing JSON, so an Ollama build that
  # ignores the flag degrades to "slower" rather than "broken".
  #
  # Set true only to experiment with reasoning quality on the explanation step.
  thinking: false

  timeout_seconds:
    # Combined classify+intent call used by the live chat view (aclassify_and_parse).
    classify_parse: 45
    # Intent-only call used by the sync path (management commands, evaluation).
    intent: 60
    explanation: 120

embedding:
  # 1024-dim BGE-M3 (~568M parameters, XLM-RoBERTa-large backbone, ~2.2GB
  # fp32). Upgraded from the old 768-dim multilingual-mpnet as part of the
  # TMDB catalog swap -- the full re-embed was happening anyway, so this
  # rides along instead of waiting on the separately-tracked golden-set-gated
  # comparison in TODOS.md. Multilingual, so it still handles non-English
  # content fine even though the product itself is English now.
  #
  # CHANGING EITHER VALUE IS NOT FREE. `dimensions` is baked into the
  # Movie.embedding and ChatSession.preference_vector columns, so a change
  # needs a schema migration AND a full re-run of
  # `manage.py generate_embeddings` over the catalog. Existing vectors are
  # not convertible between models or dimensions.
  model: BAAI/bge-m3
  dimensions: 1024

retrieval:
  # Candidates pulled from each channel before fusion.
  candidate_count: 100

  # Reciprocal Rank Fusion across the semantic and lexical channels. k=60 is
  # the value from the original paper. Semantic outweighs lexical because it
  # carries signal for every query, while lexical only fires when the user
  # names something -- so lexical loses ties rather than being suppressed.
  rrf_k: 60
  rrf_weights:
    semantic: 1.0
    lexical: 0.7

  lexical:
    # Postgres text search configuration. 'english' gives snowball stemming
    # over the catalog's English titles/keywords.
    text_search_config: english
    # Shorter tokens are almost all prepositions and articles.
    min_term_length: 3
    # Ceiling on tsquery size for a long rambling message.
    max_terms: 12

scoring:
  # Applied to signals that have been min-max normalized across the candidate
  # set, so these weights describe actual influence. Should sum to 1.0.
  weights:
    semantic: 0.35
    metadata: 0.25
    session: 0.25
    # Biases toward well-known titles. Deliberately a scoring signal, not a
    # hard filter -- TMDB's popularity metric is unbounded and non-linear,
    # so there's no absolute threshold an LLM could reliably pick (unlike
    # vote_average's bounded 0-10 scale, which *is* a hard filter below).
    popularity: 0.15
  # Value given to a signal that is identical across every candidate and so
  # carries no ranking information.
  neutral_score: 0.5

diversification:
  # Results returned to the user.
  top_n: 5
  # MMR relevance/diversity tradeoff. 1.0 is pure relevance, 0.0 pure novelty.
  lambda: 0.7

reranking:
  enabled: true
  # bge-reranker-v2-m3: multilingual, XLM-RoBERTa-large backbone (~568M params,
  # ~302M in the body). Measured on this GPU (GTX 1080 Ti): 20 pairs ~0.26s,
  # 50 pairs ~0.64s, 100 pairs ~1.22s -- versus ~5.6s for 20 pairs on CPU.
  # The GFLOPs estimate this used to cite was off by ~2x on the GPU side and
  # ~3x on the CPU side; the CPU/GPU ratio it implied held up.
  model: BAAI/bge-reranker-v2-m3
  # auto lets sentence-transformers pick (cuda > mps > cpu). Pin to "cpu" to
  # free ~2.2GB of VRAM, but only with a small reranker -- this model on CPU
  # makes every request take seconds instead of a fraction of one.
  device: auto
  # Every candidate here is a model forward pass: the main latency dial.
  # Raised from 20 to 50 now that this runs on GPU: +0.38s for a 2.5x larger
  # reranked pool, against a ~2s LLM call already in the same request.
  top_k: 50
  # Share of the final score taken from the cross-encoder; the rest stays with
  # the four-signal scorer, which carries session, genre intent, and popularity.
  weight: 0.5
  max_length: 256
  # Characters of description passed to the cross-encoder. The model truncates
  # to its own max_length anyway; this keeps tokenizer work bounded.
  description_chars: 400

session:
  # EMA weight on the newest query when updating the preference vector.
  alpha: 0.7
  # EMA weight used instead of `alpha` on turns classified as `refinement`
  # ("something funnier?", "no horror"). Explicit corrections should dominate
  # the session vector, not get diluted 70/30 by whatever the user asked for
  # one turn ago -- hard filters (negations, exclusions) already drop
  # disallowed genres outright, but the EMA vector still feeds the
  # `session` scoring signal, so a low alpha here let a stale direction
  # bias ranking among the movies that survive the filters.
  alpha_refinement: 0.92
  ttl_hours: 24

intent:
  # Minimum cosine similarity for mapping an LLM-produced genre name onto a
  # catalog genre.
  genre_match_threshold: 0.5

catalog:
  import_batch_size: 500
  embedding_batch_size: 64
  # Quality floor applied at import time: rows below this vote_count are
  # dropped along with unreleased/adult/no-overview/no-poster rows. Chosen to
  # land the imported catalog around ~50K movies (from the raw 1.49M-row
  # TMDB export), a reasonable step up from the old 18K Okko catalog without
  # importing effectively-unknown, no-signal titles.
  min_vote_count: 20
  # TMDB's image CDN. poster_path from the catalog is appended directly:
  # "{poster_base_url}{poster_size}{poster_path}".
  poster_base_url: "https://image.tmdb.org/t/p/"
  poster_size: w500
