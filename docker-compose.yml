# Shared services; automatic override adds local GPU inference.
# Cloud: docker compose -f docker-compose.yml -f docker-compose.openrouter.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://recommender:${DB_PASSWORD:-changeme}@db:5432/recommender
      PARAMS_PATH: ${PARAMS_PATH:-/app/params.yaml}
      DJANGO_SETTINGS_MODULE: recommender.settings
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-do-not-use-in-prod}
      DEBUG: ${DEBUG:-0}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/app/data:ro
      - ./params.yaml:/app/params.yaml:ro
      # evaluate_scoring writes run records to eval_runs/ under the working
      # directory (/app); without this mount `compose down` would delete them.
      - ./eval_runs:/app/eval_runs
      - model_cache:/root/.cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py import_catalog --skip-existing &&
        python manage.py check_embedding_index &&
        (python manage.py sync_tmdb_catalog || echo 'TMDB sync command failed; retry at next startup. Serving existing catalog.') &&
        uvicorn recommender.asgi:application --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  model_cache:
